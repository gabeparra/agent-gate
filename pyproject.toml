[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "agent-gate"
version = "0.1.0"
description = "Deterministic evaluation, MCP tool guardrails, and CI regression harness for LLM agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mariano Gabriel Parra" }]
dependencies = [
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
agent-gate = "agent_gate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
